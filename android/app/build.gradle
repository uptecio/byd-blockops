plugins {
    id 'com.android.application'
}

android {
    namespace 'au.local.blockops'
    compileSdk 36

    defaultConfig {
        applicationId 'au.local.blockops'
        minSdk 26
        targetSdk 36
        versionCode 14
        versionName '0.10.0'
        testInstrumentationRunner 'au.local.blockops.updates.UpdaterInstrumentation'
    }
    sourceSets.androidTest.assets.srcDir layout.buildDirectory.dir('updater-test-assets')
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
